[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ccrit-pystats"
version = "0.1.3"
description = "Python statistics helpers for CCRIT courses"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.6",
    "numpy>=1.22",
    "statsmodels>=0.14.6",
]

[project.urls]
"Core Statistics course" = "https://cambiotraining.github.io/corestats/"

[tool.setuptools.packages.find]
where = ["src"]
